<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin — Aadidev</title><link rel="icon" href="assets/images/favicon.png"><link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0}body{background:#131424;color:#fff;font:400 .92rem Sora,sans-serif;padding:1.2rem}.w{max-width:860px;margin:auto}
h1{font-size:1.3rem;margin-bottom:.3rem}.mono{font:.75rem ui-monospace,monospace;color:#F13024;letter-spacing:.08em}
input,textarea,select{width:100%;background:#0d0c1e;border:1px solid rgba(255,255,255,.15);border-radius:8px;color:#fff;padding:.7rem;font:inherit;margin:.25rem 0 .8rem}textarea{min-height:150px}
button{background:#F13024;color:#fff;border:0;border-radius:99px;padding:.55rem 1.1rem;font:700 .8rem Sora,sans-serif;cursor:pointer;margin-right:.4rem}button.g{background:transparent;border:1px solid rgba(255,255,255,.25)}button.ok{background:#2EC4A6}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin:1rem 0}.tabs button{background:transparent;border:1px solid rgba(255,255,255,.2)}.tabs .on{background:#F13024;border-color:#F13024}
.c{background:#0d0c1e;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:1rem;margin-bottom:.7rem}.c b{color:#e68e2e}.c p{color:rgba(255,255,255,.65);margin:.3rem 0 .7rem;word-break:break-word}.c small{color:rgba(255,255,255,.4)}
.bars{display:flex;align-items:flex-end;gap:.5rem;height:120px;margin:1rem 0}.bars div{flex:1;background:#F13024;border-radius:6px 6px 0 0;position:relative;min-height:3px}.bars span{position:absolute;top:-1.2rem;width:100%;text-align:center;font-size:.7rem}.bars i{position:absolute;bottom:-1.3rem;width:100%;text-align:center;font-size:.6rem;color:rgba(255,255,255,.4);font-style:normal}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 .8rem}.big{font-size:2rem;font-weight:800;color:#F13024}</style></head><body><div class="w">
<div id="login"><p class="mono">// admin.login</p><h1>Aadidev admin</h1><br><input id="k" type="password" placeholder="Admin key" autofocus><button id="go">Enter</button><p id="err" class="mono"></p></div>
<div id="app" hidden><p class="mono">// admin.dashboard</p><h1>Hey Aadidev 👋</h1><div class="tabs" id="tabs"></div><div id="main"></div></div></div>
<script>
var $=function(s){return document.querySelector(s)},K=sessionStorage.k||'',D={},T='inbox',E=null;
var e=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
function f(u,o){o=o||{};o.headers={'x-admin-key':K,'content-type':'application/json'};return fetch(u,o).then(function(r){if(r.status==401){sessionStorage.removeItem('k');$('#login').hidden=false;$('#app').hidden=true;$('#err').textContent='Wrong key or ADMIN_KEY not set';throw 0}return r.json()})}
function load(){return f('/api/admin').then(function(d){D=d;$('#login').hidden=true;$('#app').hidden=false;draw()})}
function act(b){return f('/api/admin',{method:'POST',body:JSON.stringify(b)}).then(load)}
$('#go').onclick=function(){K=$('#k').value;sessionStorage.k=K;load().catch(function(){})};$('#k').onkeydown=function(x){if(x.key=='Enter')$('#go').click()};
if(K)load().catch(function(){});
var TABS=[['inbox','📥 Inbox'],['live','✅ Live'],['posts','✍️ Posts'],['site','📊 Site']];
function when(t){return new Date(t).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
function msg(m,btns){return '<div class="c"><b>'+e(m.name)+'</b> <small>'+when(m.time)+'</small><p>'+e(m.message)+'</p>'+btns.map(function(b){return '<button class="'+b[2]+'" data-a="'+b[0]+'" data-id="'+e(m.id)+'">'+b[1]+'</button>'}).join('')+'</div>'}
function draw(){
 $('#tabs').innerHTML=TABS.map(function(t){return '<button class="'+(T==t[0]?'on':'')+'" data-t="'+t[0]+'">'+t[1]+(t[0]=='inbox'&&D.pending.length?' ('+D.pending.length+')':'')+'</button>'}).join('');
 var h='';
 if(T=='inbox')h=(D.pending.length?'<p class="mono">tip: press A to approve or R to reject the top message</p><br>':'')+(D.pending.map(function(m){return msg(m,[['approve','✓ Approve','ok'],['reject','✕ Reject','g']])}).join('')||'<div class="c">Inbox zero. Nothing waiting 🎉</div>');
 if(T=='live')h=D.approved.map(function(m){return msg(m,[['delete','Delete','g']])}).join('')||'<div class="c">No approved messages yet.</div>';
 if(T=='posts'){var p=E||{type:'book',date:new Date().toLocaleDateString('en-GB',{month:'short',year:'numeric'}),body:[]};
  h='<div class="c"><p class="mono">// '+(E?'editing post':'new post')+'</p><div class="row"><div>Type<select id="pt">'+['book','video','note'].map(function(t){return '<option'+(p.type==t?' selected':'')+'>'+t+'</option>'}).join('')+'</select></div><div>Date<input id="pd" value="'+e(p.date)+'"></div></div>Title<input id="ptl" value="'+e(p.title)+'"><div class="row"><div>Rating 1-5 (books)<input id="pr" type="number" min="1" max="5" value="'+e(p.rating)+'"></div><div>YouTube ID (videos)<input id="py" value="'+e(p.youtube)+'"></div></div>Cover image URL (optional)<input id="pc" value="'+e(p.cover)+'">Summary (one line)<input id="ps" value="'+e(p.summary)+'">Body (blank line = new paragraph)<textarea id="pb">'+e((p.body||[]).join('\n\n'))+'</textarea><button data-a="savePost">'+(E?'Save changes':'Publish post')+'</button>'+(E?'<button class="g" data-a="cancel">Cancel</button>':'')+'</div>'+D.posts.map(function(x){return '<div class="c"><b>'+e(x.title)+'</b> <small>'+e(x.type)+' · '+e(x.date)+'</small><p>'+e(x.summary)+'</p><button class="g" data-a="edit" data-id="'+e(x.id)+'">Edit</button><button class="g" data-a="deletePost" data-id="'+e(x.id)+'">Delete</button></div>'}).join('')}
 if(T=='site'){var ds=[];for(var i=6;i>=0;i--)ds.push(new Date(Date.now()-i*864e5).toISOString().slice(0,10));var mx=Math.max.apply(null,ds.map(function(d){return D.stats.days[d]||0}).concat(1));
  h='<div class="c"><p class="mono">// visitors</p><div class="big">'+D.stats.total+'</div><small>total visits (one per browser session)</small><div class="bars" style="margin-bottom:2rem">'+ds.map(function(d){var n=D.stats.days[d]||0;return '<div style="height:'+(n/mx*100)+'%"><span>'+n+'</span><i>'+d.slice(5)+'</i></div>'}).join('')+'</div></div><div class="c"><p class="mono">// announcement banner</p><p>Shows at the top of every page until visitors close it.</p><input id="bn" value="'+e(D.banner)+'" maxlength="200" placeholder="e.g. New video out now! 🎬"><button data-a="banner">Save banner</button><button class="g" data-a="clearbanner">Clear</button></div><div class="c"><p class="mono">// backup</p><p>Download everything (messages, posts, stats) as a JSON file.</p><button class="g" data-a="backup">⬇ Download backup</button></div>'}
 $('#main').innerHTML=h}
document.addEventListener('click',function(x){var t=x.target.dataset;if(t.t){T=t.t;E=null;draw();return}if(!t.a)return;var a=t.a;
 if(a=='edit'){E=D.posts.filter(function(p){return p.id==t.id})[0];draw();return}if(a=='cancel'){E=null;draw();return}
 if(a=='savePost'){var ty=$('#pt').value,ti=$('#ptl').value.trim();if(!ti)return alert('Title needed');var p={id:E?E.id:ti.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,40)+'-'+Date.now().toString(36).slice(-4),type:ty,title:ti,date:$('#pd').value,summary:$('#ps').value,cover:$('#pc').value,body:$('#pb').value.split(/\n\s*\n/).map(function(s){return s.trim()}).filter(Boolean)};
  if(ty=='book'&&$('#pr').value)p.rating=+$('#pr').value;if(ty=='video')p.youtube=$('#py').value.trim();E=null;act({action:'savePost',post:p});return}
 if(a=='banner'){act({action:'banner',text:$('#bn').value.trim()});return}if(a=='clearbanner'){act({action:'banner',text:''});return}
 if(a=='backup'){var l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));l.download='aadidev-backup-'+new Date().toISOString().slice(0,10)+'.json';l.click();return}
 if(a=='deletePost'&&!confirm('Delete this post?'))return;act({action:a,id:t.id})});
document.addEventListener('keydown',function(x){if(T!='inbox'||!D.pending||!D.pending.length||/INPUT|TEXTAREA|SELECT/.test(x.target.tagName))return;var k=x.key.toLowerCase();if(k=='a'||k=='r')act({action:k=='a'?'approve':'reject',id:D.pending[0].id})});
</script></body></html>
